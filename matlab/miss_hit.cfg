# MISS_HIT configuration (https://misshit.org) - style and lint checks for the MATLAB tools.
# CI runs:  mh_style matlab  and  mh_lint matlab
project_root
line_length: 120
indent_function_file_body: false
suppress_rule: "copyright_notice"
suppress_rule: "naming_functions"
suppress_rule: "naming_parameters"
suppress_rule: "naming_scripts"
suppress_rule: "whitespace_comments"
